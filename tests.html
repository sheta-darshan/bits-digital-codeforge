<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BITS Pilani Digital — Advanced Grading Console Test Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bits-navy: #2B296D;
  --bits-purple: #8A00FF;
  --bg-page: #F6F8FC;
  --bg-card: #FFFFFF;
  --border: #CBD5E1;
  --text-main: #141A29;
  --text-muted: #475569;
}
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background-color: var(--bg-page);
  color: var(--text-main);
  padding: 30px;
  line-height: 1.5;
}
.test-container {
  max-width: 960px;
  margin: 0 auto;
}
.header-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 4px solid var(--bits-purple);
}
.summary-strip {
  display: flex;
  gap: 16px;
}
.badge-metric {
  background: var(--bg-page);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 18px;
  text-align: center;
}
.badge-metric strong {
  display: block;
  font-size: 22px;
  font-family: 'JetBrains Mono', monospace;
}
.badge-metric.pass strong { color: #16A34A; }
.badge-metric.fail strong { color: #DC2626; }
.badge-metric.total strong { color: var(--bits-navy); }
.suite-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
}
.suite-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--bits-navy);
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}
.test-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  padding: 6px 0;
  font-family: 'JetBrains Mono', monospace;
}
.test-pass { color: #16A34A; font-weight: 700; }
.test-fail { color: #DC2626; font-weight: 700; }
.btn-rerun {
  background: var(--bits-purple);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="test-container">
  <div class="header-box">
    <div>
      <h1 style="font-size:20px; font-weight:800; color:var(--bits-navy); margin:0;">🧪 BITS Pilani Digital — Core Test Suite</h1>
      <p style="font-size:13px; color:var(--text-muted); margin:4px 0 0 0;">Phase 5 Edge Cases & Invariant Verification Runner</p>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
      <div class="summary-strip">
        <div class="badge-metric total"><strong id="totalCount">0</strong><span>Total</span></div>
        <div class="badge-metric pass"><strong id="passCount">0</strong><span>Passed</span></div>
        <div class="badge-metric fail"><strong id="failCount">0</strong><span>Failed</span></div>
      </div>
      <button type="button" class="btn-rerun" onclick="location.reload()">↺ Re-run Tests</button>
    </div>
  </div>

  <div id="suitesContainer"></div>
</div>

<script type="module">
import {
  GRADES,
  DEFAULT_CUTOFFS,
  assignGrade,
  computeStats,
  calculateGaussianCutoffs,
  calculatePercentileCutoffs,
  validateSpreadsheetData,
  checkGuardrails,
  detectWeightedComponents,
  computeWeightedTotal,
  formatGradeRange
} from './grading.js';

import {
  sanitizeFormula
} from './io.js';

let passed = 0;
let failed = 0;
const container = document.getElementById("suitesContainer");

function createSuite(title) {
  const card = document.createElement("div");
  card.className = "suite-card";
  card.innerHTML = `<div class="suite-title">${title}</div><div class="suite-tests"></div>`;
  container.appendChild(card);
  return card.querySelector(".suite-tests");
}

function test(suiteEl, name, fn) {
  const row = document.createElement("div");
  row.className = "test-item";
  try {
    fn();
    passed++;
    row.innerHTML = `<span class="test-pass">✔</span> <span>${name}</span>`;
  } catch (err) {
    failed++;
    row.innerHTML = `<span class="test-fail">✖</span> <span>${name} — <small>${err.message}</small></span>`;
  }
  suiteEl.appendChild(row);
  updateCounts();
}

function updateCounts() {
  document.getElementById("totalCount").innerText = passed + failed;
  document.getElementById("passCount").innerText = passed;
  document.getElementById("failCount").innerText = failed;
}

function expectEqual(actual, expected) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}

// Suite 1: Boundary Cutoff Semantics
const s1 = createSuite("1. Boundary Cutoff Semantics [min, derivedMax)");
test(s1, "Score exactly at 80.0 awards Grade A", () => expectEqual(assignGrade(80.0, DEFAULT_CUTOFFS), "A"));
test(s1, "Score of 79.99 falls strictly into Grade A-", () => expectEqual(assignGrade(79.99, DEFAULT_CUTOFFS), "A-"));
test(s1, "Score exactly at 70.0 awards Grade A-", () => expectEqual(assignGrade(70.0, DEFAULT_CUTOFFS), "A-"));
test(s1, "Score exactly at 60.0 awards Grade B", () => expectEqual(assignGrade(60.0, DEFAULT_CUTOFFS), "B"));
test(s1, "Score exactly at 50.0 awards Grade B-", () => expectEqual(assignGrade(50.0, DEFAULT_CUTOFFS), "B-"));
test(s1, "Score exactly at 40.0 awards Grade C", () => expectEqual(assignGrade(40.0, DEFAULT_CUTOFFS), "C"));
test(s1, "Score exactly at 30.0 awards Grade C-", () => expectEqual(assignGrade(30.0, DEFAULT_CUTOFFS), "C-"));
test(s1, "Score of 29.9 falls strictly into Grade D", () => expectEqual(assignGrade(29.9, DEFAULT_CUTOFFS), "D"));
test(s1, "Score exactly at 20.0 awards Grade D", () => expectEqual(assignGrade(20.0, DEFAULT_CUTOFFS), "D"));
test(s1, "Score below 20.0 (19.9) receives Grade E", () => expectEqual(assignGrade(19.9, DEFAULT_CUTOFFS), "E"));
test(s1, "Baseline score of 0.0 receives Grade E", () => expectEqual(assignGrade(0.0, DEFAULT_CUTOFFS), "E"));
test(s1, "Invalid NaN mark returns 'NC' (Not Computed)", () => expectEqual(assignGrade(NaN, DEFAULT_CUTOFFS), "NC"));

// Suite 2: Decimal Marks Precision
const s2 = createSuite("2. Decimal Marks Precision (No Integer Rounding)");
test(s2, "Score 79.5 is strictly < 80.0, resulting in Grade A-", () => expectEqual(assignGrade(79.5, DEFAULT_CUTOFFS), "A-"));
test(s2, "Score 64.25 evaluates to Grade B", () => expectEqual(assignGrade(64.25, DEFAULT_CUTOFFS), "B"));
test(s2, "Score 34.8 evaluates to Grade C- (>= 30.0)", () => expectEqual(assignGrade(34.8, DEFAULT_CUTOFFS), "C-"));
test(s2, "Score 29.9 evaluates to Grade D (>= 20.0)", () => expectEqual(assignGrade(29.9, DEFAULT_CUTOFFS), "D"));
test(s2, "Score 20.0 evaluates to Grade D", () => expectEqual(assignGrade(20.0, DEFAULT_CUTOFFS), "D"));
test(s2, "Score 19.9 evaluates to Grade E (< 20.0)", () => expectEqual(assignGrade(19.9, DEFAULT_CUTOFFS), "E"));
test(s2, "Score 0.5 evaluates to Grade E", () => expectEqual(assignGrade(0.5, DEFAULT_CUTOFFS), "E"));

// Suite 3: Empty Cohort Handling
const s3 = createSuite("3. Empty Cohort Handling (N = 0)");
test(s3, "computeStats handles empty cohort without NaN", () => {
  const stats = computeStats([]);
  expectEqual(stats.count, 0);
  expectEqual(stats.mean, "-");
});
test(s3, "Gaussian curving safely falls back to defaults for N=0", () => {
  const res = calculateGaussianCutoffs([]);
  expectEqual(res.cutoffs, DEFAULT_CUTOFFS);
  if (!res.warning) throw new Error("Expected warning for N=0");
});
test(s3, "Percentile curving safely falls back to defaults for N=0", () => {
  const res = calculatePercentileCutoffs([]);
  expectEqual(res.cutoffs, DEFAULT_CUTOFFS);
});

// Suite 4: Zero Variance Cohort
const s4 = createSuite("4. Zero Variance Cohort (std = 0)");
test(s4, "Uniform marks cohort has std = 0.00", () => {
  const stats = computeStats([75, 75, 75, 75]);
  expectEqual(stats.std, "0.00");
  expectEqual(stats.mean, "75.00");
});
test(s4, "Gaussian curving detects std=0 and avoids division by zero", () => {
  const res = calculateGaussianCutoffs([75, 75, 75, 75]);
  expectEqual(res.cutoffs, DEFAULT_CUTOFFS);
  if (!res.warning) throw new Error("Expected std=0 warning");
});

// Suite 5: Extreme Boundary Scores
const s5 = createSuite("5. Extreme Boundary Scores (0.0 and 100.0)");
test(s5, "Extreme marks 0 and 100 compute min=0 and max=100", () => {
  const stats = computeStats([0, 50, 100]);
  expectEqual(stats.min, 0);
  expectEqual(stats.max, 100);
});

// Suite 6: Monotonic Descending Invariants
const s6 = createSuite("6. Monotonic Descending Cutoff Invariants");
test(s6, "Gaussian cutoffs are strictly descending: c(A) > c(A-) > ... > c(E)=0", () => {
  const res = calculateGaussianCutoffs([20, 35, 45, 60, 75, 85, 95]);
  for (let i = 0; i < GRADES.length - 1; i++) {
    if (res.cutoffs[GRADES[i]] <= res.cutoffs[GRADES[i + 1]]) {
      throw new Error(`Violation between ${GRADES[i]} and ${GRADES[i+1]}`);
    }
  }
});
test(s6, "Percentile cutoffs are strictly descending", () => {
  const res = calculatePercentileCutoffs([20, 35, 45, 60, 75, 85, 95]);
  for (let i = 0; i < GRADES.length - 1; i++) {
    if (res.cutoffs[GRADES[i]] <= res.cutoffs[GRADES[i + 1]]) {
      throw new Error(`Violation between ${GRADES[i]} and ${GRADES[i+1]}`);
    }
  }
});
test(s6, "Gaussian handles high scores [98..100] with all cutoffs <= 100, strictly descending, E=0", () => {
  const res = calculateGaussianCutoffs([98, 99, 100, 100, 100]);
  expectEqual(res.cutoffs["E"], 0);
  for (let i = 0; i < GRADES.length - 1; i++) {
    if (res.cutoffs[GRADES[i]] <= res.cutoffs[GRADES[i + 1]]) throw new Error(`Not strictly descending: ${GRADES[i]} <= ${GRADES[i+1]}`);
    if (res.cutoffs[GRADES[i]] > 100) throw new Error(`${GRADES[i]} > 100`);
  }
});
test(s6, "Percentile handles high scores [98..100] with all cutoffs <= 100, strictly descending, E=0", () => {
  const res = calculatePercentileCutoffs([98, 99, 100, 100, 100]);
  expectEqual(res.cutoffs["E"], 0);
  for (let i = 0; i < GRADES.length - 1; i++) {
    if (res.cutoffs[GRADES[i]] <= res.cutoffs[GRADES[i + 1]]) throw new Error(`Not strictly descending: ${GRADES[i]} <= ${GRADES[i+1]}`);
    if (res.cutoffs[GRADES[i]] > 100) throw new Error(`${GRADES[i]} > 100`);
  }
});
test(s6, "Gaussian handles high scores [95..100] with all cutoffs <= 100, strictly descending, E=0", () => {
  const res = calculateGaussianCutoffs([95, 96, 97, 98, 99, 100]);
  expectEqual(res.cutoffs["E"], 0);
  for (let i = 0; i < GRADES.length - 1; i++) {
    if (res.cutoffs[GRADES[i]] <= res.cutoffs[GRADES[i + 1]]) throw new Error(`Not strictly descending: ${GRADES[i]} <= ${GRADES[i+1]}`);
    if (res.cutoffs[GRADES[i]] > 100) throw new Error(`${GRADES[i]} > 100`);
  }
});
test(s6, "Percentile handles high scores [95..100] with all cutoffs <= 100, strictly descending, E=0", () => {
  const res = calculatePercentileCutoffs([95, 96, 97, 98, 99, 100]);
  expectEqual(res.cutoffs["E"], 0);
  for (let i = 0; i < GRADES.length - 1; i++) {
    if (res.cutoffs[GRADES[i]] <= res.cutoffs[GRADES[i + 1]]) throw new Error(`Not strictly descending: ${GRADES[i]} <= ${GRADES[i+1]}`);
    if (res.cutoffs[GRADES[i]] > 100) throw new Error(`${GRADES[i]} > 100`);
  }
});

// Suite 7: Formula Injection Sanitization (CWE-1236)
const s7 = createSuite("7. Formula Injection Sanitization (CWE-1236)");
test(s7, "Neutralizes '=' prefix", () => expectEqual(sanitizeFormula("=1+1"), "'=1+1"));
test(s7, "Neutralizes '+' prefix", () => expectEqual(sanitizeFormula("+123"), "'+123"));
test(s7, "Neutralizes '-' prefix", () => expectEqual(sanitizeFormula("-5"), "'-5"));
test(s7, "Neutralizes '@' prefix", () => expectEqual(sanitizeFormula("@SUM(A1)"), "'@SUM(A1)"));
test(s7, "Safe student ID is unchanged", () => expectEqual(sanitizeFormula("2024A7PS0012P"), "2024A7PS0012P"));

// Suite 8: Spreadsheet Validation Engine
const s8 = createSuite("8. Spreadsheet Validation Engine");
test(s8, "Flags missing required headers", () => {
  const res = validateSpreadsheetData([{ "Student": "1", "Score": 80 }]);
  expectEqual(res.valid, false);
  expectEqual(res.errors[0].id, "HEADER_MISSING");
});
test(s8, "Flags dirty data with duplicates and out-of-bounds", () => {
  const dirty = [
    { "BITS ID": "1", "Course": "CS", "Total Marks": 80 },
    { "BITS ID": "1", "Course": "CS", "Total Marks": 90 }, // duplicate
    { "BITS ID": "2", "Course": "CS", "Total Marks": -10 }, // out of bounds
    { "BITS ID": "3", "Course": "CS", "Total Marks": 75.5 } // valid
  ];
  const res = validateSpreadsheetData(dirty);
  expectEqual(res.valid, false);
  expectEqual(res.summary.validCount, 2);
  expectEqual(res.summary.errorCount, 2);
});

// Suite 9: Weighted Component Marks
const s9 = createSuite("9. Weighted Assessment Components");
test(s9, "Computes weighted total correctly", () => {
  const student = { "BITS ID": "1", "Quiz": 80, "Midsem": 70, "Compre": 90 };
  const total = computeWeightedTotal(student, { "Quiz": 20, "Midsem": 30, "Compre": 50 });
  expectEqual(total, 82);
});
test(s9, "Detects multi-component exam columns", () => {
  const rows = [{ "BITS ID": "1", "Course": "CS", "Total Marks": 100, "Quiz": 20, "Midsem": 30, "Compre": 50 }];
  const cols = detectWeightedComponents(rows);
  expectEqual(cols, ["Quiz", "Midsem", "Compre"]);
});

// Suite 10: Mathematical Grade Range Interval Formatting
const s10 = createSuite("10. Mathematical Grade Range Interval Formatting");
test(s10, "Grade A is formatted as closed interval [80, 100]", () => {
  expectEqual(formatGradeRange("A", DEFAULT_CUTOFFS), "[80, 100]");
});
test(s10, "Grade A- is formatted as half-open interval [70, 80)", () => {
  expectEqual(formatGradeRange("A-", DEFAULT_CUTOFFS), "[70, 80)");
});
test(s10, "All remaining grades formatted as clean [min, max) half-open intervals", () => {
  expectEqual(formatGradeRange("B", DEFAULT_CUTOFFS), "[60, 70)");
  expectEqual(formatGradeRange("B-", DEFAULT_CUTOFFS), "[50, 60)");
  expectEqual(formatGradeRange("C", DEFAULT_CUTOFFS), "[40, 50)");
  expectEqual(formatGradeRange("C-", DEFAULT_CUTOFFS), "[30, 40)");
  expectEqual(formatGradeRange("D", DEFAULT_CUTOFFS), "[20, 30)");
  expectEqual(formatGradeRange("E", DEFAULT_CUTOFFS), "[0, 20)");
});
</script>
</body>
</html>
